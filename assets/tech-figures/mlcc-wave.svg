<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="mlcc-wave-title mlcc-wave-desc">
<title id="mlcc-wave-title">02 / 10 μF 与 4 μF 的电压下降量</title><desc id="mlcc-wave-desc">净放电电流恒定为 100 mA，观察 0–2 μs；假设算例。理想积分模型 · 非实测；未绘制任何器件的 DC Bias 曲线</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs>
<rect width="720" height="430" fill="#f8fbf9"/>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#244a45;font-size:17px}.muted{fill:#526d67}.accent{fill:#126455}.warm{fill:#9b5827}</style>
<text x="28" y="35" font-size="23" style="font-size:23px;fill:#244a45" text-anchor="start" font-weight="700">02 / 10 μF 与 4 μF 的电压下降量</text>
<text x="28" y="63" font-size="16" style="font-size:16px;fill:#526d67" text-anchor="start">净放电电流恒定为 100 mA，观察 0–2 μs；假设算例</text>
<line x1="28" y1="80" x2="692" y2="80" stroke="#d7e4de" stroke-width="1"/>
<text x="28" y="413" font-size="14" style="font-size:14px;fill:#526d67" text-anchor="start">理想积分模型 · 非实测；未绘制任何器件的 DC Bias 曲线</text>
<line x1="100" y1="320.0" x2="650" y2="320.0" stroke="#d7e4de" stroke-width="1" stroke-dasharray="4 4"/>
<text x="82" y="325.0" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="end">0</text>
<line x1="100" y1="240.0" x2="650" y2="240.0" stroke="#d7e4de" stroke-width="1" stroke-dasharray="4 4"/>
<text x="82" y="245.0" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="end">20</text>
<line x1="100" y1="160.0" x2="650" y2="160.0" stroke="#d7e4de" stroke-width="1" stroke-dasharray="4 4"/>
<text x="82" y="165.0" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="end">40</text>
<line x1="100" y1="120.0" x2="650" y2="120.0" stroke="#d7e4de" stroke-width="1" stroke-dasharray="4 4"/>
<text x="82" y="125.0" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="end">50</text>
<line x1="100" y1="320" x2="665" y2="320" stroke="#244a45" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="100" y1="320" x2="100" y2="103" stroke="#244a45" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="28" y="104" font-size="16" style="font-size:16px;fill:#244a45" text-anchor="start">ΔV / mV</text>
<text x="100.0" y="347" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="middle">0</text>
<text x="375.0" y="347" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="middle">1</text>
<text x="650.0" y="347" font-size="15" style="font-size:15px;fill:#244a45" text-anchor="middle">2</text>
<text x="654" y="373" font-size="16" style="font-size:16px;fill:#244a45" text-anchor="end">t / μs</text>
<path d="M100.000,320.000 L650.000,120.000" fill="none" stroke="#9b5827" stroke-width="3" stroke-linejoin="round"/>
<path d="M100.000,320.000 L650.000,240.000" fill="none" stroke="#126455" stroke-width="3" stroke-linejoin="round"/>
<text x="330" y="183" font-size="18" style="font-size:18px;fill:#9b5827" text-anchor="start">4 μF → 50 mV</text>
<text x="420" y="253" font-size="18" style="font-size:18px;fill:#126455" text-anchor="start">10 μF → 20 mV</text>
<text x="100" y="393" font-size="16" style="font-size:16px;fill:#244a45" text-anchor="start">纵轴是“下降量”，不是端电压；容量取有效值。</text>
</svg>
