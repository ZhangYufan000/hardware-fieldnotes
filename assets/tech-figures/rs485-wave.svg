<title id="rs485-wave-title">02 / 失配时，边沿之后还可能再变化</title><desc id="rs485-wave-desc">接收端差分电压的定性比较；时间与幅值均为相对量。自绘趋势 · 非实测、非传输线仿真；反射形态取决于阻抗与传播延迟</desc>
