<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="rs485-circuit-title rs485-circuit-desc">
<title id="rs485-circuit-title">01 / 终端电阻跨在干线的两个物理端</title><desc id="rs485-circuit-desc">A、B 是一对总线导线；每个收发器用短支线接入。拓扑示意 · 未画参考线、供电、偏置与保护；不代表可以省略这些设计</desc>
