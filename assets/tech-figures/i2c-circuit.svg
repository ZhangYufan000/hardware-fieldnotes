<text x="550" y="400" font-size="18" style="font-size:18px;fill:#9b5827" text-anchor="middle">目标器件：仍下拉</text>
<text x="365" y="439" font-size="17" style="font-size:17px;fill:#244a45" text-anchor="middle">输出“高”意味着释放，由上拉电阻恢复高电平。</text>
