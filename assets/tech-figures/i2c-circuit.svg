<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="i2c-circuit-title i2c-circuit-desc">
<title id="i2c-circuit-title">01 / SDA 被拉低，先找谁还在下拉</title><desc id="i2c-circuit-desc">开漏等效结构：控制器释放，并不意味着总线已经变高。仅画 SDA · 开关表示开漏输出级；未画保护与寄生电容</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs>
<rect width="720" height="470" fill="#f8fbf9"/>
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#244a45;font-size:17px}.muted{fill:#526d67}.accent{fill:#126455}.warm{fill:#9b5827}</style>
<text x="28" y="35" font-size="23" style="font-size:23px;fill:#244a45" text-anchor="start" font-weight="700">01 / SDA 被拉低，先找谁还在下拉</text>
<text x="28" y="63" font-size="16" style="font-size:16px;fill:#526d67" text-anchor="start">开漏等效结构：控制器释放，并不意味着总线已经变高</text>
<line x1="28" y1="80" x2="692" y2="80" stroke="#d7e4de" stroke-width="1"/>
<text x="28" y="453" font-size="14" style="font-size:14px;fill:#526d67" text-anchor="start">仅画 SDA · 开关表示开漏输出级；未画保护与寄生电容</text>
<text x="365" y="112" font-size="17" style="font-size:17px;fill:#244a45" text-anchor="middle">VPU</text>
